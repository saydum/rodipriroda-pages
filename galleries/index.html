    <meta name="DC.Subject"
          content="Школа-Академия «РОД и ПриРОДа» - это источник безценной кладези Знаний ПервоИстоков Наших Предков Ведающих Русов, которые сохранили в своем Роду преподаватели данных курсов, собрание многолетнего опыта их жизни в Ведическом Миропонимании Наших Предков, что передается от учителя к ученику по Роду.">
    <meta name="DC.Description" content="«РОД и ПриРОДа» РУСские ВЕДические Центры и Семейно-РОДовая Школа-Академия НаРОДного Целительства и РОДового ЗнаХарства, Очищения, Оздоровления, Целительства: Духа, Души, Тела, СоВести, Энергетики и Возрождения Любви в Гармонии с Родом и ПриРодой.
С 2005г собирают в своём сердце - энергетически мощном кругу, стремящихся познать Наследие Наших Предков Родовых ПервоИстоков Ведической Руси, пробудить свою Родовую память, возродить Родовую связь – и этим укрепить свой Род, Здоровье и Любовь в нём. Чтобы эти знания передавались из поколения в поколение в Роду, как раньше Родовые книги и самое сакральное - из уст в уста от прародителей к своим наследникам.
Тысячи людей, прошедшие курсы Школы-Академии, изменили свою жизнь к лучшему – пришли к своим Родовым целям, возродили Здоровье и Любовь, родили здравых детей, применяя наработанные эффективные методики преподавателей и через личный опыт уже помогают сотням и тысячам других людей – приходящим к ним, как к профессионалам своего дела.

КОНЦЕПЦИЯ ШКОЛЫ-АКАДЕМИИ
 Духовное Наследие Ведической Культуры Родных Предков
 Семейно-Родовая Психология, Духовное, Душевное и Физическое Здоровье Человека, Семьи, Рода и Общества
 Гармонизация сознания, формирование духовно-нравственных основ поведения, здорового образа жизни, Семейно-Родовых отношений

ЦЕЛЬ ШКОЛЫ-АКАДЕМИИ
 Соединение человека значимым звеном в родовой цепи поколений и переход его сознания через мосты Родовой памяти в гармоничные потоки Вселенной: Правды, Чести, Совести, Единство Противоположностей, Любовь.

ЗАДАЧИ ШКОЛЫ-АКАДЕМИИ
 Научить человека разбираться в потоках энергий, которые проникают в слои жизни и включить Родовую Память в жизненный поток, чтобы обрести гармонию.
 Научить человека развивать свои психофизические возможности для самостоятельного нормирования здоровья и событий жизни на основе Ведических Родовых Знаний, чтобы изменить свои духовные и душевные качества, которые включат процессы самоисцеления тела, чтобы вернуть утраченное здоровье и радость жизни.
 Открыть в человеке Родовой Потенциал через чистое сознание своей связи с Родом для создания счастливой полноценной Семьи и продолжение Рода.
 Научить человека самому правильно нарабатывать положительную энергию, сохранять её, а уже потом правильно делиться ею и дарить её. Дать человеку самому реализовать свои возможности и проявить свой талант при полной ответственности и правильном понимании Космических Законов.

ШКОЛА-АКАДЕМИЯ проводит семинары и индивидуальные обучающие программы ОЧНО И ОНЛАЙН.
МОДЕЛЬ ОЗДОРОВЛЕНИЯ ПРЕДПОЛАГАЕТ В ТЕЧЕНИЕ ВСЕГО КУРСА ВОСПОЛНИТЬ ПРОБЕЛЫ СОВРЕМЕННОГО МИРА:
 Сформировать правильное здоровое миропонимание, мировосприятие и мировоззрение (Чистые помыслы, Любовь, Честь, Совесть и СамоОсознание) на жизнь Семьи и Рода в целом
 Направить на общие цели родителей и детей для взаимопонимания и улучшения отношений между поколениями. При этом все участники понимают, что главным экзаменом является сама Жизнь

Школа-Академия помогает разобраться с первопричинами болезни, создать здоровое энергоинформационное поле своих тел и пространство вокруг себя, быть в ладу со всем своим Родом, вернуть силу молодости, наполниться энергиями любви, радости, счастья, здоровья, самоисцеления, богатства и достатка.
Вас ждёт глубокое погружение в Родовые Природные Энергии и мощнейшая трансформация на всех уровнях жизни Человека: духовном, душевном, физическом, энергетическом, переход на новые высокие уровни качества счастливой Жизни и Судьбы, возрождение Родовых Ведических Знаний, Гармонии и Любви, Здоровья, Счастья, Богатства, Успеха, Удачи, Благополучия, Лада, Мира, Радости и Процветания Мужского и Женского Начал в своей Семье и в Роду со знанием, правильным пониманием и выполнением своего Родового ПриРодного Предназначения.
Каждый участник нашей Школы-Академии после её прохождения вступает в новую жизнь с крепким Духом - Харизмой и могучей Душой – Характером, наполненным мощью и энергией Телом, на свою новую Родовую ПриРодную более высокую «ступень» со Знаниями Вещих Русов – ВЕДами навстречу своим мечтам и целям, материализации их во Благо себе, своему Роду, Природе и Семье, зная и выполняя свое Родовое предназначение.
Академия приглашает целителей, психологов и педагогов для обучения по оздоровительной методике “Ведическая Родовая Здрава Русов”, через которую человек восстанавливает целостность ТриЕдинства Духа, Души и Тела.
Программы Школы-Академии могут корректироваться преподавателями курса.
Расписание Очных индивидуальных и Семейно-Родовых курсов, а также Онлайн курсов составляется под возможности и пожелания участников.">
